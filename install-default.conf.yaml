- defaults:
    link:
      relink: true

- clean: ["~"]

- shell:
    - [git submodule update --init --recursive, Installing submodules]

- link:
    ~/.dotfiles:
      path: ""
      relink: true
    ~/.gitconfig:
    ~/.gitconfig-linux:
    ~/.gitconfig-mac:
    ~/.local/bin/diff-so-fancy:
      create: true
      path: diff-so-fancy/diff-so-fancy
    ~/.p10k.zsh:
    ~/.zshenv:
      force: true
    ~/.zshrc:
      force: true
