- defaults:
    link:
      relink: true

- clean: ["~"]

- shell:
    - [git submodule update --init --recursive, Installing submodules]

- link:
    ~/.dotfiles:
      path: ""
      relink: true
    ~/.gitconfig:
    ~/.gitconfig-linux:
    ~/.gitconfig-mac:
    ~/.local/bin/diff-so-fancy:
      create: true
      path: diff-so-fancy/diff-so-fancy
    ~/.p10k.zsh:
    ~/.zshenv:
      force: true
    ~/.zshrc:
      force: true

# fleet holds shared Claude config and installs itself; cloned (not a submodule) so every install gets latest main
- shell:
    - command: '{ [ -d ~/.fleet ] && git -C ~/.fleet pull --ff-only -q || git clone -q https://github.com/larrifax/fleet.git ~/.fleet; } && ~/.fleet/install'
      description: Installing fleet
